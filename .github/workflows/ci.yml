name: CI

# Pull-request gate: every check here must pass before a PR can merge to main.
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, unit, integration + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # Authoritative 95% coverage gate. Deploy does NOT re-check the coverage
      # percentage (see deploy.yml) — this PR check is where it's enforced.
      - name: Unit + integration tests with 95% coverage gate
        run: npm run test:cov
      - name: End-to-end tests (mocked AWS + DynamoDB)
        run: npm run test:e2e

  mutation:
    name: Mutation testing (changed lines only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so Stryker can diff against the PR base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Incremental mutation state: a re-push only re-tests what changed.
      - name: Restore incremental mutation state
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.head_ref }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.head_ref }}-
            stryker-incremental-
      # Only the LINES this PR added or changed are mutated (file:start-end
      # ranges). Mutating whole files made a small edit to a large service
      # cost up to an hour; the untouched lines were tested when written.
      - name: Stryker on changed lines vs ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          RANGES=$(scripts/mutation-ranges.sh "origin/${{ github.base_ref }}" HEAD)
          if [ -z "$RANGES" ]; then
            echo "No mutable source lines changed in this PR; skipping mutation testing."
            exit 0
          fi
          echo "Mutating changed lines:"; echo "$RANGES" | tr "," "\n"
          npx stryker run --incremental --incrementalFile reports/stryker-incremental.json --mutate "$RANGES"
