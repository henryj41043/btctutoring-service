name: Build and Deploy Service to ECS

on:
  push:
    branches:
      - main

env:
  ECR_IMAGE: ${{ vars.ECR_IMAGE }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  # Post-merge safety net: re-runs lint + the full test suite against merged main
  # (catches a bad/semantic merge that no single PR saw) before shipping.
  # The 95% coverage THRESHOLD is enforced on the PR (ci.yml) — the authoritative
  # gate — not here: re-checking a fractional coverage percentage against the
  # merged tree can disagree with the PR run and block already-reviewed, merged
  # code from deploying. So this runs `npm test` (no --coverage) to verify the
  # tests pass, without re-litigating the coverage number.
  test:
    name: Tests (post-merge safety net)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: End-to-end tests (mocked AWS + DynamoDB)
        run: npm run test:e2e

  deploy:
    # Nothing ships to ECS unless every test suite passes.
    needs: test
    # The service runs on ARM64 (Fargate Graviton). Building on a native ARM
    # runner means nothing is emulated: under QEMU on an x86 runner the same
    # build took 4 minutes on a good day and up to 12 on a bad one.
    runs-on: ubuntu-24.04-arm
    # OIDC: assume the btctutoring-github-deploy role instead of static keys.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Layers are cached between runs (GitHub Actions cache), so the
      # dependency install is only repeated when package*.json changes.
      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/btctutoring/btctutoring-service:${{ vars.ECR_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Targets the CDK-managed cluster/service (btctutoring-infra). The task
      # role provides AWS access at runtime — no static keys in the container.
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster btctutoring \
            --service btctutoring-service \
            --force-new-deployment \
            --region "${{ vars.AWS_DEFAULT_REGION }}"
